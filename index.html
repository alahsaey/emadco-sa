    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        color: #f8fafc;
        font-family: 'Cairo', 'IBM Plex Sans Arabic', sans-serif;
        user-select: none;
      }
      .splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 140px;
        margin-bottom: 24px;
        animation: splashPulse 2.4s ease-in-out infinite alternate;
      }
      .splash-logo-img {
        width: 130px;
        height: 130px;
        object-fit: contain;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.5));
      }
      @keyframes splashPulse {
        0% { transform: scale(0.96); filter: drop-shadow(0 6px 16px rgba(245, 158, 11, 0.2)); }
        100% { transform: scale(1.04); filter: drop-shadow(0 16px 32px rgba(245, 158, 11, 0.45)); }
      }
      .splash-bar {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 18px;
        position: relative;
      }
      .splash-bar-progress {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        border-radius: 999px;
        animation: splashProgress 1.6s ease-in-out infinite alternate;
      }
      @keyframes splashProgress {
        0% { left: 0%; width: 25%; }
        100% { left: 75%; width: 25%; }
      }
    </style>

  <body class="font-sans antialiased bg-slate-50 text-slate-900 selection:bg-amber-500 selection:text-white">
    <div id="root">
      <!-- شاشة الإقلاع الأولية بالشعار الأصلي الشفاف المتناسق مع خلفية الجوال وشريط المهام -->
      <div id="initial-splash">
        <div class="splash-logo-container">
          <img src="/pwa-icon.svg" alt="عمادكو لمواد البناء" class="splash-logo-img" />
        </div>
        <h1 style="font-size: 20px; font-weight: 800; margin: 0; color: #ffffff; letter-spacing: -0.02em;">مؤسسة عماد سعد آل سعيد</h1>
        <p style="font-size: 13px; font-weight: 600; margin: 6px 0 0 0; color: #f59e0b;">نظام إدارة مواد البناء ونقاط البيع السحابي</p>
        <div class="splash-bar">
          <div class="splash-bar-progress"></div>
        </div>
        <span style="font-size: 11px; color: #94a3b8; margin-top: 12px; font-weight: 500;">جاري تهيئة النظام السحابي والبيانات...</span>
      </div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[SW] Registered successfully:', reg.scope);
          }).catch((err) => {
            console.warn('[SW] Registration failed:', err);
          });
        });
      }
    </script>
    <script>
      // دالة حقن واجهة إدارة المصروفات
      window.initExpensesUI = () => {
        const modal = document.createElement('div');
        modal.id = 'expenses-modal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999999;';
        modal.innerHTML = `
          <div style="background:white;padding:20px;border-radius:10px;width:400px;">
            <h3>إدارة المصروفات</h3>
            <input type="number" id="exp-amount" placeholder="المبلغ" style="display:block;width:100%;margin-bottom:10px;padding:5px;">
            <input type="text" id="exp-desc" placeholder="الوصف" style="display:block;width:100%;margin-bottom:10px;padding:5px;">
            <input type="text" id="exp-cat" placeholder="التصنيف" style="display:block;width:100%;margin-bottom:10px;padding:5px;">
            <button onclick="saveExpense()">حفظ المصروف</button>
            <button onclick="document.getElementById('expenses-modal').remove()">إغلاق</button>
          </div>
        `;
        document.body.appendChild(modal);
      };

      window.saveExpense = async () => {
        const amount = document.getElementById('exp-amount').value;
        const description = document.getElementById('exp-desc').value;
        const category = document.getElementById('exp-cat').value;
        await fetch('/api/expenses', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ amount, description, category })
        });
        alert('تم حفظ المصروف');
        const modal = document.getElementById('expenses-modal');
        if (modal) modal.remove();
      };
      
      // إضافة زر "إدارة المصروفات" بتصميم متناسق مع شريط التنقل السفلي
      const navBar = document.querySelector('nav') || document.querySelector('.bottom-nav') || document.body;
      const btn = document.createElement('button');
      btn.innerHTML = `<span style="display:block;font-size:18px;">💰</span><span style="display:block;font-size:10px;">المصروفات</span>`;
      btn.onclick = window.initExpensesUI;
      // تنسيق الزر ليتناسب مع شريط الأدوات السفلي
      btn.style.cssText = 'background:none; border:none; color:inherit; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; padding:5px;';
      
      // إضافته بجوار زر الإعدادات أو في مكان مناسب في شريط التنقل
      if (navBar) {
          navBar.appendChild(btn);
      } else {
          // fallback إذا لم يوجد شريط تنقل واضح
          btn.style.cssText = 'position:fixed; bottom:80px; right:10px; z-index:9999; background:white; padding:10px; border-radius:50%; box-shadow:0 2px 5px rgba(0,0,0,0.2);';
          document.body.appendChild(btn);
      }
    </script>
