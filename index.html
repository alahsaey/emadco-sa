    <script>
      (function() {
        if (window.location.protocol === 'file:') {
          var serverRunning = false;
          var activeServerUrl = 'http://localhost:3000';
          var checkUrls = [
            'http://localhost:3000/api/health',
            'http://127.0.0.1:3000/api/health',
            'http://localhost:3001/api/health',
            'http://127.0.0.1:3001/api/health',
            'http://localhost:8080/api/health'
          ];

          function updateUI(status, foundUrl) {
            var badge = document.getElementById('server-status-badge');
            var btn = document.getElementById('open-system-btn');
            var hint = document.getElementById('server-status-hint');
            if (!badge || !btn) return;

            if (status === 'online') {
              serverRunning = true;
              activeServerUrl = foundUrl || 'http://localhost:3000';
              badge.style.background = 'rgba(16, 185, 129, 0.2)';
              badge.style.borderColor = '#10b981';
              badge.style.color = '#34d399';
              badge.innerHTML = '🟢 تم تشغيل الخادم المحلي بنجاح! جاري الدخول للنظام...';
              btn.style.background = '#10b981';
              btn.style.color = '#ffffff';
              btn.innerHTML = '🚀 الدخول إلى النظام الآن (' + activeServerUrl + ')';
              if (hint) {
                hint.innerHTML = '<span style="color:#34d399;font-weight:bold;">✓ الخادم جاهز، جاري التحويل التلقائي خلال لحظات...</span>';
              }
              // تحويل تلقائي فوري
              setTimeout(function() {
                window.location.href = activeServerUrl;
              }, 400);
            } else {
              serverRunning = false;
              badge.style.background = 'rgba(239, 68, 68, 0.15)';
              badge.style.borderColor = '#ef4444';
              badge.style.color = '#f87171';
              badge.innerHTML = '🔴 الخادم المحلي غير مشغل حالياً (متوقف)';
              btn.style.background = '#334155';
              btn.style.color = '#94a3b8';
              btn.innerHTML = '⚠️ الخادم متوقف - شغّل تشغيل_النظام.bat أولاً';
              if (hint) {
                hint.innerHTML = 'النظام ينتظر تشغيل الخادم في الخلفية... سيتم تحويلك تلقائياً بمجرد تشغيل الملف.';
              }
            }
          }

          function pingServer() {
            var checkedCount = 0;
            var anySuccess = false;

            checkUrls.forEach(function(url) {
              fetch(url, { method: 'GET', mode: 'cors' })
                .then(function(res) {
                  if (res.ok) {
                    anySuccess = true;
                    var origin = url.replace('/api/health', '');
                    updateUI('online', origin);
                  }
                })
                .catch(function() {})
                .finally(function() {
                  checkedCount++;
                  if (checkedCount === checkUrls.length && !anySuccess && !serverRunning) {
                    updateUI('offline');
                  }
                });
            });
          }

          // بدء الفحص الدوري كل 1.5 ثانية
          setInterval(pingServer, 1500);
          pingServer();

          window.addEventListener('DOMContentLoaded', function() {
            var warn = document.createElement('div');
            warn.id = 'file-protocol-warning';
            warn.style.cssText = 'position:fixed;inset:0;background:#0b1120;color:#ffffff;z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;font-family:system-ui,-apple-system,sans-serif;direction:rtl;overflow-y:auto;';
            warn.innerHTML = `
              <div style="max-width:620px;width:100%;background:#1e293b;border:2px solid #f59e0b;border-radius:22px;padding:30px 24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);box-sizing:border-box;">
                <div style="font-size:46px;margin-bottom:8px;">💻</div>
                <h2 style="font-size:22px;font-weight:800;color:#f59e0b;margin:0 0 10px 0;">تشغيل نظام عمادكو المحاسبي أوفلاين (بدون إنترنت)</h2>

                <!-- شارة حالة الخادم المباشرة -->
                <div id="server-status-badge" style="display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid #ef4444;background:rgba(239,68,68,0.15);color:#f87171;margin-bottom:18px;transition:all 0.3s ease;">
                  🔴 الخادم المحلي غير مشغل حالياً (متوقف)
                </div>

                <div style="background:#0f172a;border-radius:14px;padding:18px;text-align:right;margin-bottom:20px;border:1px solid #334155;line-height:1.9;">
                  <div style="font-weight:800;color:#38bdf8;margin-bottom:8px;font-size:15px;">📌 خطوتان فقط لتشغيل النظام بنجاح:</div>
                  <ol style="margin:0;padding-right:20px;font-size:13.5px;color:#f1f5f9;line-height:2.2;">
                    <li>افتح مجلد النظام على جهازك: <code style="background:#1e293b;color:#fbbf24;padding:2px 8px;border-radius:6px;font-family:monospace;font-size:13px;">emadco-pos</code></li>
                    <li>انقر نقراً مزدوجاً على أحد ملفات التشغيل: <b style="color:#10b981;background:rgba(16,185,129,0.2);padding:2px 8px;border-radius:6px;">START.bat</b> أو <b style="color:#38bdf8;background:rgba(56,189,248,0.2);padding:2px 8px;border-radius:6px;">تشغيل_النظام.bat</b></li>
                    <li style="color:#cbd5e1;font-size:12.5px;">(اترك نافذة الخادم مفتوحة في الخلفية - فهي المحرك الذي يشغل النظام بدون إنترنت)</li>
                  </ol>
                </div>

                <div style="margin-bottom:16px;">
                  <button id="open-system-btn" type="button" style="background:#334155;color:#94a3b8;font-weight:800;padding:14px 26px;border-radius:12px;font-size:15px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;border:none;box-shadow:0 4px 14px rgba(0,0,0,0.3);transition:all 0.2s ease;">
                    ⚠️ الخادم متوقف - شغّل تشغيل_النظام.bat أولاً
                  </button>
                </div>

                <div id="server-status-hint" style="font-size:12.5px;color:#94a3b8;line-height:1.7;">
                  النظام يفحص اتصال جهازك بالخادم تلقائياً... بمجرد تشغيل الملف ستفتح الشاشة فوراً.
                </div>

                <div style="margin-top:16px;padding-top:14px;border-top:1px dashed #334155;font-size:11.5px;color:#64748b;">
                  💡 سبب هذا الإجراء: حماية بيانات فواتيرك ومخزونك وضمان عمل قاعدة البيانات المحلية بأمان تام أوفلاين.
                </div>
              </div>
            `;

            document.body.appendChild(warn);

            var btn = document.getElementById('open-system-btn');
            if (btn) {
              btn.addEventListener('click', function(e) {
                e.preventDefault();
                if (serverRunning) {
                  window.location.href = activeServerUrl;
                } else {
                  alert('⚠️ تنبيه:\nالخادم المحلي لم يتم تشغيله بعد على جهاز الكمبيوتر.\n\nيرجى الذهاب إلى مجلد البرنامج والنقر نقراً مزدوجاً على:\n(تشغيل_النظام.bat)\n\nواترك النافذة السوداء مفتوحة ليعمل النظام!');
                  pingServer();
                }
              });
            }
          });
        }
      })();
    </script>

    <script>
      // حارس الإقلاع الفوري: يضمن عدم بقاء شاشة الإقلاع معلقة نهائياً عند انقطاع الإنترنت
      window.dismissInitialSplash = function() {
        const splash = document.getElementById('initial-splash');
        if (splash) {
          splash.style.opacity = '0';
          splash.style.transform = 'scale(0.97)';
          splash.style.pointerEvents = 'none';
          setTimeout(() => {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 400);
        }
      };

      window.forceDismissSplash = function() {
        window.dismissInitialSplash();
      };

      // 1. إظهار زر التخطي السريع بعد ثانية ونصف كإجراء أمان إضافي
      setTimeout(() => {
        const btn = document.getElementById('splash-force-enter-btn');
        if (btn) btn.style.display = 'inline-block';
      }, 1500);

      // 2. إخفاء الشاشة تلقائياً بعد ثانيتين كحد أقصى لمنع أي تعليق
      setTimeout(() => {
        window.dismissInitialSplash();
      }, 2200);

      // 3. مراقبة تحميل واجهة React
      if (window.MutationObserver) {
        const root = document.getElementById('root');
        if (root) {
          const obs = new MutationObserver((mutations) => {
            for (const m of mutations) {
              for (const node of m.addedNodes) {
                if (node.nodeType === 1 && node.id !== 'initial-splash') {
                  window.dismissInitialSplash();
                  obs.disconnect();
                  return;
                }
              }
            }
          });
          obs.observe(root, { childList: true, subtree: true });
        }
      }

      // منع الأخطاء الناتجة عن محاولة الاتصال بالخوادم البعيدة أثناء عدم توفر الإنترنت من إيقاف الصفحة
      window.addEventListener('unhandledrejection', (ev) => {
        if (ev.reason && (String(ev.reason).includes('fetch') || String(ev.reason).includes('network') || String(ev.reason).includes('Failed to fetch'))) {

            <div id="modal-exp-summary" style="background:linear-gradient(135deg, #fef3c7, #fde68a);padding:14px;border-radius:10px;font-weight:700;text-align:center;margin-bottom:15px;color:#92400e;font-size:14px;border:1px solid #fcd34d;">

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
                <input type="number" id="modal-exp-amount" placeholder="المبلغ (ر.س)" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;">
                <input type="date" id="modal-exp-date" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;">
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
                <input type="text" id="modal-exp-desc" placeholder="الوصف (أجار المحل، فاتورة كهرباء...)" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;">
                <input type="text" id="modal-exp-cat" placeholder="التصنيف (ثابت، تشغيلي، أجور...)" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;">
              </div>
              <button onclick="window.submitModalExpense()" style="width:100%;background:#f59e0b;color:white;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;">حفظ وإضافة المصروف</button>
            </div>

            <h4 style="margin:0 0 10px 0;font-size:14px;color:#334155;">سجل المصروفات</h4>
            <div id="modal-expenses-list" style="max-height:250px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:8px;"></div>

        const dateInput = document.getElementById('modal-exp-date');
        if (dateInput) dateInput.valueAsDate = new Date();
        window.loadExpensesModalData();
      };

      window.getLocalExpenses = () => {
        try {
          const stored = localStorage.getItem('emadco_store_expenses');
          return stored ? JSON.parse(stored) : [];
        } catch (e) {
          return [];
        }
      };

      window.saveLocalExpenses = (expenses) => {
        try {
          localStorage.setItem('emadco_store_expenses', JSON.stringify(expenses));
        } catch (e) {}
      };

      window.getExpenses = async () => {
        try {
          const res = await fetch('/api/expenses');
          const data = await res.json();
          if (data && data.success && Array.isArray(data.expenses) && data.expenses.length > 0) {
            window.saveLocalExpenses(data.expenses);
            return data.expenses;
          }
        } catch (e) {}
        return window.getLocalExpenses();
      };

      window.loadExpensesModalData = async () => {
        try {
          const expenses = await window.getExpenses();
          expenses.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

          const now = new Date();
          const currentMonth = now.toISOString().slice(0, 7); // YYYY-MM
          const currentYear = now.toISOString().slice(0, 4); // YYYY

          const monthTotal = expenses
            .filter(e => e.date && e.date.startsWith(currentMonth))
            .reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

          const yearTotal = expenses
            .filter(e => e.date && e.date.startsWith(currentYear))
            .reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

          const summaryEl = document.getElementById('modal-exp-summary');
          if (summaryEl) {
            summaryEl.innerHTML = `إجمالي مصروفات الشهر الحالي: <span style="font-size:16px;color:#b45309;">${monthTotal.toFixed(2)} ر.س</span> | إجمالي السنة: ${yearTotal.toFixed(2)} ر.س`;
          }

          const listEl = document.getElementById('modal-expenses-list');
          if (listEl) {
            if (expenses.length === 0) {
              listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">لا توجد مصروفات مسجلة حتى الآن</div>';
            } else {
              listEl.innerHTML = expenses.map(e => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:13px;">
                  <div>
                    <div style="font-weight:700;color:#1e293b;">${e.description} <span style="font-size:11px;background:#e0f2fe;color:#0369a1;padding:2px 6px;border-radius:4px;margin-right:6px;">${e.category}</span></div>
                    <div style="color:#64748b;font-size:11px;margin-top:2px;">${e.date ? e.date.split('T')[0] : '-'}</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-weight:700;color:#b45309;">${e.amount} ر.س</span>
                    <button onclick="window.deleteExpense('${e.id}')" style="background:#fee2e2;color:#dc2626;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;">حذف</button>
                  </div>
                </div>
              `).join('');
            }
          }
        } catch (err) {
          console.error('Error loading expenses:', err);
        }
      };

      window.submitModalExpense = async () => {
        const amount = document.getElementById('modal-exp-amount').value;
        const description = document.getElementById('modal-exp-desc').value;
        const category = document.getElementById('modal-exp-cat').value;
        const date = document.getElementById('modal-exp-date').value;

        if (!amount || !description || !category) {
          alert('يرجى تعبئة كافة الحقول المطلوبة (المبلغ، الوصف، التصنيف)');
          return;
        }

        const expenses = window.getLocalExpenses();
        const newExpense = { id: Date.now(), amount, description, category, date: date || new Date().toISOString().split('T')[0] };
        expenses.unshift(newExpense);
        window.saveLocalExpenses(expenses);

        try {
          await fetch('/api/expenses', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(newExpense)
          });
        } catch (e) {}

        document.getElementById('modal-exp-amount').value = '';
        document.getElementById('modal-exp-desc').value = '';
        document.getElementById('modal-exp-cat').value = '';
        alert('تمت إضافة المصروف بنجاح');
        window.loadExpensesModalData();
      };

      window.deleteExpense = async (id) => {
        if (!confirm('هل أنت متأكد من حذف هذا المصروف؟')) return;
        let expenses = window.getLocalExpenses();
        expenses = expenses.filter(e => String(e.id) !== String(id));
        window.saveLocalExpenses(expenses);

        try {
          await fetch('/api/expenses/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id })
          });
        } catch (e) {}

        window.loadExpensesModalData();
      };

            <span style="font-weight: 800; font-size: 13.5px; white-space: nowrap;">مصروفات المحل والمؤسسة</span>

      // إخفاء زر "استعلام وطباعة الفواتير" من شريط أقسام النظام المحاسبي العلوي وضبط التوزيع المتناسق
      function cleanTopInvoiceLookupButton() {
        const allButtons = document.querySelectorAll('button');
        allButtons.forEach(btn => {
          if (btn.classList.contains('emadco-dropdown-item') || btn.closest('.emadco-dropdown-panel')) {
            return;
          }
          const txt = (btn.textContent || '').trim();
          if (txt.includes('استعلام وطباعة الفواتير')) {
            const container = btn.closest('div.grid');
            if (container) {
              btn.style.setProperty('display', 'none', 'important');
              container.style.gridTemplateColumns = 'repeat(5, minmax(0, 1fr))';
            }
          }
        });

        // تعديل شارة الترويسة في الشريط العلوي لحذف النص المكرر
        const allSpans = document.querySelectorAll('span');
        allSpans.forEach(sp => {
          if (sp.textContent && sp.textContent.includes('تشمل استعلام الفواتير،')) {
            sp.textContent = sp.textContent.replace('استعلام الفواتير، ', '');
          }
        });
      }

              iconSvg: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`
            }
          ]
        }
      ];

      let isHubEventsBound = false;
      let lastTrackedActiveLabel = '';

      function closeAllHubDropdowns() {
        document.querySelectorAll('.emadco-dropdown-panel').forEach(p => {
          p.style.display = 'none';
        });
        document.querySelectorAll('.emadco-hub-arrow').forEach(a => {
          a.style.transform = 'rotate(0deg)';
        });
      }

      function triggerRawNavAction(targetLabel) {
        const navBar = document.getElementById('main-app-nav-toolbar');
        if (navBar) {
          const rawButtons = Array.from(navBar.querySelectorAll('.emadco-raw-nav-btn'));
          for (const b of rawButtons) {
            const txt = (b.textContent || '').trim();
            if (txt.includes(targetLabel) || targetLabel.includes(txt)) {
              b.click();
              return true;
            }
          }
        }
        // بحث شامل احتياطي
        const allButtons = Array.from(document.querySelectorAll('button'));
        for (const b of allButtons) {
          if (b.classList.contains('emadco-hub-btn') || b.closest('.emadco-dropdown-panel')) continue;
          const txt = (b.textContent || '').trim();
          if (txt.includes(targetLabel) || targetLabel.includes(txt)) {
            b.click();
            return true;
          }
        }
        return false;
      }

      function enhanceNavigationToolbar() {
        let navBar = document.getElementById('main-app-nav-toolbar');
        if (!navBar) {
          const allButtons = document.querySelectorAll('button');
          for (const btn of allButtons) {
            const txt = (btn.textContent || '').trim();
            if (txt.includes('كتالوج مواد البناء') || txt.includes('الموردون والمصانع') || txt.includes('المبيعات ونقاط البيع')) {
              navBar = btn.closest('div.overflow-x-auto, div.flex, div.mb-2') || btn.parentElement;
              if (navBar) {
                navBar.id = 'main-app-nav-toolbar';
                break;
              }
            }
          }
        }

        if (!navBar) return;

        // إعداد الحاوية لضمان عدم اقتصاص القوائم المنسدلة
        navBar.style.overflow = 'visible';
        navBar.style.position = 'relative';
        navBar.style.background = 'transparent';
        navBar.style.border = 'none';
        navBar.style.boxShadow = 'none';
        navBar.style.padding = '0';

        // إضافة ترويسة البوابات الأنيقة مرة واحدة
        let toolbarHeader = document.getElementById('nav-toolbar-header-bar');
        if (!toolbarHeader && navBar.parentElement) {
          toolbarHeader = document.createElement('div');
          toolbarHeader.id = 'nav-toolbar-header-bar';
          toolbarHeader.style.cssText = 'display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 2px 6px; direction: rtl;';
          toolbarHeader.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="width: 10px; height: 10px; border-radius: 999px; background: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.5);"></div>
              <span style="font-size: 14px; font-weight: 800; color: #0f172a;">بوابات النظام ووحدات العمليات الرئيسية</span>
              <span style="font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 2px 10px; border-radius: 999px; font-weight: 700; border: 1px solid #bae6fd;">4 بوابات ذكية مدمجة</span>
            </div>
            <div style="font-size: 12px; color: #64748b; font-weight: 600;">
              قوائم منسدلة سريعة • بدون تمرير أفقي
            </div>
          `;
          navBar.parentElement.insertBefore(toolbarHeader, navBar);
        }

        // إخفاء الأزرار الأصلية القديمة (13 زر) مع الاحتفاظ بها للتنقل
        const rawButtons = Array.from(navBar.children).filter(el =>
          el.tagName === 'BUTTON' && !el.classList.contains('emadco-hub-btn')
        );
        rawButtons.forEach(btn => {
          btn.classList.add('emadco-raw-nav-btn');
          btn.style.setProperty('display', 'none', 'important');
        });

        // تحديد الشاشة النشطة حالياً في النظام
        let activeRawLabel = '';
        for (const b of rawButtons) {
          const cls = b.className || '';
          const isAct = (cls.includes('text-white') && cls.includes('font-black')) ||
                        cls.includes('bg-slate-900') ||
                        cls.includes('bg-emerald-600') ||
                        cls.includes('bg-rose-700') ||
                        cls.includes('bg-purple-700') ||
                        cls.includes('bg-blue-600') ||
                        cls.includes('bg-amber-500');
          if (isAct) {
            activeRawLabel = (b.textContent || '').trim();
            break;
          }
        }
        if (!activeRawLabel) {
          const allOtherBtns = Array.from(document.querySelectorAll('button'));
          for (const b of allOtherBtns) {
            if (b.classList.contains('emadco-hub-btn') || b.closest('.emadco-dropdown-panel')) continue;
            const cls = b.className || '';
            const isAct = (cls.includes('text-white') && cls.includes('font-black')) ||
                          cls.includes('bg-slate-900 text-white');
            if (isAct) {
              const txt = (b.textContent || '').trim();
              if (txt.includes('استعلام وطباعة الفواتير')) {
                activeRawLabel = 'استعلام وطباعة الفواتير';
                break;
              }
            }
          }
        }
        if (!activeRawLabel) {
          activeRawLabel = 'لوحة القيادة والمؤشرات';
        }

        // بناء حاوية البوابات الأربع مرة واحدة فقط في الـ DOM لمنع أي رمش أو اهتزاز
        let hubsGrid = document.getElementById('emadco-4hubs-bar');
        const isFirstBuild = !hubsGrid;

        if (isFirstBuild) {
          hubsGrid = document.createElement('div');
          hubsGrid.id = 'emadco-4hubs-bar';
          hubsGrid.className = 'emadco-hubs-grid';
          navBar.appendChild(hubsGrid);

          HUBS_CONFIG.forEach(hub => {
            const hubWrapper = document.createElement('div');
            hubWrapper.id = `hub-wrapper-${hub.id}`;
            hubWrapper.className = 'emadco-hub-wrapper';

            let dropdownHtml = '';
            if (hub.isDropdown && hub.items) {
              dropdownHtml = `
                <div class="emadco-dropdown-panel" id="dropdown-panel-${hub.id}" style="display: none;">
                  <div class="emadco-dropdown-header">
                    <span style="font-size: 12px; font-weight: 800; color: #0f172a;">${hub.dropdownTitle}</span>
                    <span style="font-size: 10.5px; font-weight: 700; background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 999px;">${hub.dropdownBadge}</span>
                  </div>
                  <div style="display: flex; flex-direction: column;">
                    ${hub.items.map(item => `
                      <div
                        class="emadco-dropdown-item"
                        id="dropdown-item-${hub.id}-${item.id}"
                        data-target="${item.targetLabel}"
                        title="${item.label} - ${item.sub}"
                      >
                        <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                          <div style="width: 30px; height: 30px; border-radius: 8px; background: ${item.iconBg}; color: ${item.iconColor}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                            ${item.iconSvg}
                          </div>
                          <div style="display: flex; flex-direction: column; text-align: right; line-height: 1.25;">
                            <span class="dropdown-item-title" style="font-size: 12.5px; font-weight: 800; color: #1e293b;">${item.label}</span>
                            <span style="font-size: 10.5px; font-weight: 500; color: #64748b; margin-top: 1px;">${item.sub}</span>
                          </div>
                        </div>
                        <div class="dropdown-item-indicator" style="font-size: 12px; color: #cbd5e1; font-weight: 800;">
                          ‹
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }

            hubWrapper.innerHTML = `
              <button
                type="button"
                id="hub-btn-${hub.id}"
                class="emadco-hub-btn inactive"
                title="${hub.label}"
              >
                <div style="display: flex; align-items: center; gap: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                  <div class="emadco-hub-badge" id="hub-badge-${hub.id}" style="background: ${hub.badgeBg}; color: ${hub.badgeColor}; border: 1px solid ${hub.badgeBorder};">
                    ${hub.iconSvg}
                  </div>
                  <div style="display: flex; flex-direction: column; align-items: flex-start; text-align: right; line-height: 1.2;">
                    <span class="hub-title-span" style="font-size: 13.5px; font-weight: 800; color: #0f172a;">${hub.label}</span>
                    <span class="hub-sub-span" id="hub-sub-${hub.id}" style="font-size: 10.5px; font-weight: 700; color: #34d399; margin-top: 2px; display: none;"></span>
                  </div>
                </div>
                ${hub.isDropdown ? `
                  <div style="display: flex; align-items: center; gap: 4px; margin-right: 6px;">
                    <svg class="emadco-hub-arrow" id="hub-arrow-${hub.id}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #64748b; transition: transform 0.2s ease;">
                      <polyline points="6 9 12 15 18 9"/>
                    </svg>
                  </div>
                ` : `
                  <div class="hub-dot" id="hub-dot-${hub.id}" style="width: 8px; height: 8px; border-radius: 999px; background: #fbbf24; box-shadow: 0 0 8px #fbbf24; display: none;"></div>
                `}
              </button>
              ${dropdownHtml}
            `;

            hubsGrid.appendChild(hubWrapper);

            // ربط حدث النقر على زر البوابة مرة واحدة
            const btnEl = hubWrapper.querySelector(`#hub-btn-${hub.id}`);
            if (btnEl) {
              btnEl.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (hub.id === 'dashboard') {
                  closeAllHubDropdowns();
                  triggerRawNavAction(hub.targetLabel);
                } else {
                  const panel = document.getElementById(`dropdown-panel-${hub.id}`);
                  const arrow = document.getElementById(`hub-arrow-${hub.id}`);
                  const isCurrentlyOpen = (panel && panel.style.display === 'block');
                  closeAllHubDropdowns();
                  if (!isCurrentlyOpen && panel) {
                    panel.style.display = 'block';
                    if (arrow) arrow.style.transform = 'rotate(180deg)';
                  }
                }
              };
            }

            // ربط حدث النقر على عناصر القائمة المنسدلة مرة واحدة
            if (hub.isDropdown && hub.items) {
              hub.items.forEach(item => {
                const itemEl = hubWrapper.querySelector(`#dropdown-item-${hub.id}-${item.id}`);
                if (itemEl) {
                  itemEl.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    closeAllHubDropdowns();
                    triggerRawNavAction(item.targetLabel);
                  };
                }
              });
            }
          });
        }

        // تحديث الحالات النشطة فقط إذا تغيرت الشاشة (بدون إعادة بناء الـ DOM مطلقاً)
        if (activeRawLabel !== lastTrackedActiveLabel || isFirstBuild) {
          lastTrackedActiveLabel = activeRawLabel;

          HUBS_CONFIG.forEach(hub => {
            const hubBtn = document.getElementById(`hub-btn-${hub.id}`);
            const hubBadge = document.getElementById(`hub-badge-${hub.id}`);
            const hubTitle = hubBtn ? hubBtn.querySelector('.hub-title-span') : null;
            const hubSub = document.getElementById(`hub-sub-${hub.id}`);
            const hubDot = document.getElementById(`hub-dot-${hub.id}`);

            let isHubActive = false;
            let activeSubLabel = '';

            if (hub.id === 'dashboard') {
              isHubActive = activeRawLabel.includes('لوحة القيادة');
            } else if (hub.items) {
              for (const item of hub.items) {
                if (activeRawLabel.includes(item.targetLabel) || item.targetLabel.includes(activeRawLabel)) {
                  isHubActive = true;
                  activeSubLabel = item.label;
                  break;
                }
              }
            }

            if (hubBtn) {
              hubBtn.className = 'emadco-hub-btn ' + (isHubActive ? 'active' : 'inactive');
            }
            if (hubBadge) {
              hubBadge.style.background = isHubActive ? 'rgba(255,255,255,0.15)' : hub.badgeBg;
              hubBadge.style.color = isHubActive ? '#fbbf24' : hub.badgeColor;
              hubBadge.style.borderColor = isHubActive ? 'rgba(255,255,255,0.25)' : hub.badgeBorder;
            }
            if (hubTitle) {
              hubTitle.style.color = isHubActive ? '#ffffff' : '#0f172a';
            }
            if (hubSub) {
              hubSub.textContent = activeSubLabel ? '• ' + activeSubLabel : '';
              hubSub.style.display = activeSubLabel ? 'inline' : 'none';
            }
            if (hubDot) {
              hubDot.style.display = isHubActive ? 'block' : 'none';
            }

            // تحديث تمييز العنصر النشط داخل القائمة المنسدلة
            if (hub.items) {
              hub.items.forEach(item => {
                const itemEl = document.getElementById(`dropdown-item-${hub.id}-${item.id}`);
                if (itemEl) {
                  const isItemActive = activeRawLabel.includes(item.targetLabel) || item.targetLabel.includes(activeRawLabel);
                  itemEl.classList.toggle('active-item', isItemActive);
                  const titleSpan = itemEl.querySelector('.dropdown-item-title');
                  if (titleSpan) titleSpan.style.color = isItemActive ? '#15803d' : '#1e293b';
                  const ind = itemEl.querySelector('.dropdown-item-indicator');
                  if (ind) {
                    ind.textContent = isItemActive ? '✓' : '‹';
                    ind.style.color = isItemActive ? '#16a34a' : '#cbd5e1';
                  }
                }
              });
            }
          });
        }

        // ربط مستمع الإغلاق عند النقر بالخارج أو الضغط على زر ESC مرة واحدة فقط
        if (!isHubEventsBound) {
          isHubEventsBound = true;
          document.addEventListener('click', (e) => {
            if (!e.target.closest('.emadco-hub-wrapper')) {
              closeAllHubDropdowns();
            }
          });
          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
              closeAllHubDropdowns();
            }
          });
        }
      }

      // دالة لتحديد شبكة بطاقات الإحصائيات في منتصف لوحة التحكم بدقة تامة
      function getDashboardStatsGrid() {
        const allSpans = document.querySelectorAll('span, p, div, h3, h4');
        for (const el of allSpans) {
          // البحث عن بطاقة الأرباح الإجمالية بالاسم
          if (el.textContent && el.textContent.includes('الأرباح الإجمالية (Gross Profit)')) {
            const card = el.closest('.rounded-xl') || el.closest('[class*="rounded"]');
            if (card) {
              const grid = card.closest('.grid') || (card.parentElement && card.parentElement.classList.contains('grid') ? card.parentElement : null);
              if (grid) {
                return { grid, grossProfitCard: card };
              }
            }
          }
        }

        // بحث احتياطي عبر بطاقة مبيعات اليوم
        for (const el of allSpans) {
          if (el.textContent && el.textContent.includes('مبيعات اليوم')) {
            const card = el.closest('.rounded-xl') || el.closest('[class*="rounded"]');
            if (card) {
              const grid = card.closest('.grid') || (card.parentElement && card.parentElement.classList.contains('grid') ? card.parentElement : null);
              if (grid) {
                return { grid, grossProfitCard: null };
              }
            }
          }
        }

        return null;
      }

      // 3. ربط المصروفات وصافي الربح مع شبكة الإحصائيات في منتصف لوحة القيادة وحساب دقيق 100%
      // 3. تحسين مظهر وتنسيق بطاقات الإحصائيات (10 بطاقات بنظام شبكي متناسق 5 أعمدة وصفين متطابقين)
      setInterval(() => {
        ensureFloatingExpensesButton();

        // إزالة أي حاويات قديمة أو مكررة أسفل النظام
        document.querySelectorAll('#store-expenses-container').forEach(el => el.remove());

        const statsGridInfo = getDashboardStatsGrid();

        // إزالة أي بطاقات إحصائيات للمصروفات أو صافي الربح متواجدة خارج شبكة الإحصائيات
        document.querySelectorAll('#injected-expenses-stat-card, #injected-net-profit-card').forEach(el => {
          if (!statsGridInfo || el.parentElement !== statsGridInfo.grid) {
            el.remove();
          }
        });

        // إذا لم نكن في لوحة القيادة الحاوية لشبكة الإحصائيات، لا داعي للإضافة
        if (!statsGridInfo || !statsGridInfo.grid) {
          return;
        }

        const grid = statsGridInfo.grid;

        // تطبيق تنسيق الشبكة المتقدمة 5 أعمدة على الشاشات الكبيرة لتوزيع البطاقات الـ 10 بشكل متوازن تماماً
        grid.className = 'grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3.5';

        const expenses = window.getLocalExpenses();
        const now = new Date();
        const currentMonth = now.toISOString().slice(0, 7);
        const monthExpensesTotal = expenses
          .filter(e => e.date && e.date.startsWith(currentMonth))
          .reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

        // استخراج قيمة الأرباح الإجمالية الفعلية من بطاقة النظام الحية
        let grossProfitVal = 0.00;
        if (statsGridInfo.grossProfitCard) {
          const valEl = statsGridInfo.grossProfitCard.querySelector('.text-2xl, .font-mono');
          if (valEl) {
            const cleanText = valEl.textContent.replace(/,/g, '').trim();
            const numMatch = cleanText.match(/-?[\d]+\.?\d*/);
            if (numMatch) {
              const parsed = parseFloat(numMatch[0]);
              if (!isNaN(parsed)) grossProfitVal = parsed;
            }
          } else {
            const cardText = (statsGridInfo.grossProfitCard.textContent || '').replace(/,/g, '');
            const match = cardText.match(/([\d]+\.?\d*)\s*(?:ر\.س)?/);
            if (match) {
              const parsed = parseFloat(match[1]);
              if (!isNaN(parsed)) grossProfitVal = parsed;
            }
          }
        }

        // حساب صافي الربح الفعلي رياضياً بدقة متناهية: الأرباح الإجمالية - المصروفات
        const netProfitVal = grossProfitVal - monthExpensesTotal;
        const isLoss = netProfitVal < 0;

        // تنسيق العملة
        const formatCurrency = (val) => Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // 1. بطاقة مصروفات المحل والمؤسسة (الشهر)
        let expCard = document.getElementById('injected-expenses-stat-card');
        if (!expCard || expCard.parentElement !== grid) {
          if (expCard) expCard.remove();
          expCard = document.createElement('div');
          expCard.id = 'injected-expenses-stat-card';
          grid.appendChild(expCard);
        }
        expCard.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-2xs hover:border-amber-400/80 transition-all cursor-pointer flex flex-col justify-between col-span-1 min-h-[122px]';
        expCard.style.cssText = 'background: #ffffff !important; color: #0f172a !important; border: 1px solid #e2e8f0 !important; border-radius: 14px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; min-height: 122px; box-sizing: border-box; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); transition: all 0.2s ease; cursor: pointer; order: 9;';
        expCard.onclick = () => window.initExpensesUI();
        expCard.title = 'انقر لتسجيل أو إدارة مصروفات المحل والمؤسسة';
        expCard.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:12px;font-weight:700;color:#334155;">مصروفات المحل والمؤسسة</span>
            <div style="width:28px;height:28px;border-radius:8px;background:#fef3c7;color:#d97706;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">💰</div>
          </div>
          <div style="font-size:24px;font-weight:900;font-family:monospace;color:#0f172a;margin:2px 0;">
            ${formatCurrency(monthExpensesTotal)} <span style="font-size:12px;font-weight:700;color:#64748b;">ر.س</span>
          </div>
          <div style="font-size:11px;color:#64748b;font-weight:600;margin-top:4px;display:flex;align-items:center;justify-content:space-between;">
            <span>فواتير تشغيلية ورواتب</span>
            <span style="color:#b45309;background:#fef3c7;border:1px solid #fde68a;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;">تسجيل ➕</span>
          </div>
        `;

        // 2. بطاقة صافي الربح الفعلي (Net Profit)
        let netCard = document.getElementById('injected-net-profit-card');
        if (!netCard || netCard.parentElement !== grid) {
          if (netCard) netCard.remove();
          netCard = document.createElement('div');
          netCard.id = 'injected-net-profit-card';
          grid.appendChild(netCard);
        }
        netCard.className = 'p-4 rounded-xl border shadow-2xs transition-all flex flex-col justify-between col-span-1 min-h-[122px]';
        if (isLoss) {
          netCard.style.cssText = 'background: linear-gradient(180deg, #ffffff 0%, #fff1f2 100%) !important; color: #0f172a !important; border: 1.5px solid #fca5a5 !important; border-radius: 14px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; min-height: 122px; box-sizing: border-box; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); transition: all 0.2s ease; order: 10;';
          netCard.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <span style="font-size:12px;font-weight:800;color:#9f1239;">صافي الربح (عجز تشغيلي)</span>
              <div style="width:28px;height:28px;border-radius:8px;background:#ffe4e6;color:#e11d48;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">📉</div>
            </div>
            <div style="font-size:24px;font-weight:900;font-family:monospace;color:#be123c;margin:2px 0;">
              ${formatCurrency(netProfitVal)} <span style="font-size:12px;font-weight:700;color:#e11d48;">ر.س</span>
            </div>
            <div style="font-size:10.5px;color:#9f1239;font-weight:600;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              الأرباح (${formatCurrency(grossProfitVal)}) - المصروفات (${formatCurrency(monthExpensesTotal)})
            </div>
          `;
        } else {
          netCard.style.cssText = 'background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%) !important; color: #0f172a !important; border: 1.5px solid #86efac !important; border-radius: 14px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; min-height: 122px; box-sizing: border-box; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); transition: all 0.2s ease; order: 10;';
          netCard.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <span style="font-size:12px;font-weight:800;color:#166534;">صافي الربح الفعلي (Net Profit)</span>
              <div style="width:28px;height:28px;border-radius:8px;background:#dcfce7;color:#16a34a;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">📈</div>
            </div>
            <div style="font-size:24px;font-weight:900;font-family:monospace;color:#15803d;margin:2px 0;">
              +${formatCurrency(netProfitVal)} <span style="font-size:12px;font-weight:700;color:#16a34a;">ر.س</span>
            </div>
            <div style="font-size:10.5px;color:#166534;font-weight:600;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              الأرباح (${formatCurrency(grossProfitVal)}) - المصروفات (${formatCurrency(monthExpensesTotal)})
            </div>
          `;
        }

        // 3. توحيد مظهر كافة البطاقات وترتيبها بنسق هندسي أنيق
        const allCards = Array.from(grid.children);
        allCards.forEach(card => {
          card.style.minHeight = '122px';
          card.style.display = 'flex';
          card.style.flexDirection = 'column';
          card.style.justifyContent = 'space-between';
          card.style.borderRadius = '14px';
          card.style.padding = '15px';
          card.style.boxSizing = 'border-box';
          card.style.transition = 'all 0.2s cubic-bezier(0.4, 0, 0.2, 1)';

          const txt = card.textContent || '';
          if (txt.includes('مبيعات اليوم')) card.style.order = '1';
          else if (txt.includes('مبيعات الشهر الحالي')) card.style.order = '2';
          else if (txt.includes('إجمالي الفواتير')) card.style.order = '3';
          else if (txt.includes('متوسط قيمة الفاتورة')) card.style.order = '4';
          else if (txt.includes('المبيعات الآجلة')) card.style.order = '5';
          else if (txt.includes('المدفوع نقداً')) card.style.order = '6';
          else if (txt.includes('المدفوع عبر الشبكة')) card.style.order = '7';
          else if (txt.includes('الأرباح الإجمالية')) card.style.order = '8';
        });

        // 4. توحيد بطاقة الأرباح الإجمالية لتتوافق مع الثيم الفاخر لكافة البطاقات
        if (statsGridInfo.grossProfitCard) {
          const gCard = statsGridInfo.grossProfitCard;
          gCard.style.background = '#ffffff';
          gCard.style.color = '#0f172a';
          gCard.style.border = '1px solid #e2e8f0';
          gCard.style.boxShadow = '0 1px 3px 0 rgba(0, 0, 0, 0.05)';
          const titleEl = gCard.querySelector('span');
          if (titleEl) {
            titleEl.style.color = '#334155';
            titleEl.style.fontWeight = '700';
          }
          const iconWrap = gCard.querySelector('.p-1\\.5, div[class*="rounded-lg"]');
          if (iconWrap) {
            iconWrap.style.background = '#eff6ff';
            iconWrap.style.color = '#2563eb';
          }
          const numEl = gCard.querySelector('.text-2xl, .font-mono');
          if (numEl) {
            numEl.style.color = '#0f172a';
            const spanInNum = numEl.querySelector('span');
            if (spanInNum) spanInNum.style.color = '#64748b';
          }
          const marginEl = gCard.querySelector('.text-emerald-400, div[class*="text-emerald"]');
          if (marginEl) {
            marginEl.style.color = '#15803d';
            marginEl.style.fontWeight = '600';
          }
        }
      }, 500);

      // معالج شامل لعملية تسجيل الخروج وضمان إنهاء الجلسة تماماً وتحديث حالة الاتصال بالعضوية
      window.performSystemLogout = function() {
        try {
          const authKeys = [
            'esa', 'emadco_current_user', 'emadco_auth', 'user', 'currentUser',
            'auth_token', 'emadco_session', 'auth', 'logged_user', 'session',
            'emadco_user_session', 'emadco_logged_in'
          ];
          authKeys.forEach(key => {
            localStorage.removeItem(key);
            sessionStorage.removeItem(key);
          });

          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && (k.includes('auth') || k.includes('user') || k.includes('session') || k.includes('esa') || k.includes('emadco'))) {
              localStorage.removeItem(k);
            }
          }

          fetch('/api/db/users', { method: 'GET' })
            .then(res => res.json())
            .then(data => {
              if (data && Array.isArray(data.data)) {
                data.data.forEach(u => {
                  u.isOnline = false;
                  u.lastActiveAt = new Date().toISOString();
                  fetch(`/api/db/users/${u.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(u)
                  }).catch(() => {});
                });
              }
            }).catch(() => {});
        } catch (e) {
          console.warn('Logout cleanup notice:', e);
        }

        window.location.href = window.location.pathname;
      };

      document.addEventListener('click', function(e) {
        const target = e.target.closest('button, a, div');
        if (!target) return;
        const text = (target.textContent || '').trim();
        if (
          text === 'تسجيل خروج' ||
          text === 'تسجيل الخروج' ||
          text === 'خروج' ||
          text === 'Logout' ||
          target.getAttribute('aria-label') === 'تسجيل خروج' ||
          target.title === 'تسجيل خروج' ||
          target.id.includes('logout') ||
          target.className.includes('logout')
        ) {
          e.preventDefault();
          e.stopPropagation();
          window.performSystemLogout();
        }
      }, true);
    </script>
  </body>
</html>
