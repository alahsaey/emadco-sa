      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        color: #f8fafc;
        font-family: 'Cairo', 'IBM Plex Sans Arabic', sans-serif;
        user-select: none;
      }
      .splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 140px;
        margin-bottom: 24px;

      }
      .splash-logo-img {
        width: 130px;
        height: 130px;
        object-fit: contain;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.5));

      @keyframes splashPulse {
        0% { transform: scale(0.96); filter: drop-shadow(0 6px 16px rgba(245, 158, 11, 0.2)); }
        100% { transform: scale(1.04); filter: drop-shadow(0 16px 32px rgba(245, 158, 11, 0.45)); }
      }
      .splash-bar {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 18px;

      .splash-bar-progress {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        border-radius: 999px;
        animation: splashProgress 1.6s ease-in-out infinite alternate;
      }
      @keyframes splashProgress {
        0% { left: 0%; width: 25%; }
        100% { left: 75%; width: 25%; }
      }
    </style>

        </div>
        <h1 style="font-size: 20px; font-weight: 800; margin: 0; color: #ffffff; letter-spacing: -0.02em;">مؤسسة عماد سعد آل سعيد</h1>
        <p style="font-size: 13px; font-weight: 600; margin: 6px 0 0 0; color: #f59e0b;">نظام إدارة مواد البناء ونقاط البيع السحابي</p>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {

          }).catch((err) => {
            console.warn('[SW] Registration failed:', err);

    </script>
    <script>
      window.initExpensesUI = async () => {
        const existingModal = document.getElementById('expenses-modal');
        if (existingModal) existingModal.remove();

        const modal = document.createElement('div');
        modal.id = 'expenses-modal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999999;padding:15px;direction:rtl;';
        modal.innerHTML = `
          <div style="background:white;padding:24px;border-radius:16px;width:100%;max-width:550px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,0.2);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;border-bottom:1px solid #e2e8f0;padding-bottom:10px;">
              <h3 style="margin:0;font-size:18px;font-weight:700;color:#1e293b;">إدارة مصروفات المؤسسة والمحل</h3>
              <button onclick="document.getElementById('expenses-modal').remove()" style="background:#f1f5f9;border:none;border-radius:50%;width:32px;height:32px;font-weight:bold;cursor:pointer;color:#64748b;">✕</button>
            </div>
            
            <div id="modal-exp-summary" style="background:linear-gradient(135deg, #fef3c7, #fde68a);padding:14px;border-radius:10px;font-weight:700;text-align:center;margin-bottom:15px;color:#92400e;font-size:14px;border:1px solid #fcd34d;">
              جاري حساب الإجمالي...
            </div>

            <div style="background:#f8fafc;padding:15px;border-radius:10px;margin-bottom:20px;border:1px solid #e2e8f0;">
              <h4 style="margin:0 0 10px 0;font-size:14px;color:#334155;">تسجيل مصروف جديد</h4>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
                <input type="number" id="modal-exp-amount" placeholder="المبلغ (ر.س)" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;">
                <input type="date" id="modal-exp-date" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;">
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
                <input type="text" id="modal-exp-desc" placeholder="الوصف (أجار المحل، فاتورة كهرباء...)" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;">
                <input type="text" id="modal-exp-cat" placeholder="التصنيف (ثابت، تشغيلي، أجور...)" style="padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;">
              </div>
              <button onclick="window.submitModalExpense()" style="width:100%;background:#f59e0b;color:white;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;">حفظ وإضافة المصروف</button>
            </div>

            <h4 style="margin:0 0 10px 0;font-size:14px;color:#334155;">سجل المصروفات</h4>
            <div id="modal-expenses-list" style="max-height:250px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:8px;"></div>
          </div>
        `;
        document.body.appendChild(modal);
        const dateInput = document.getElementById('modal-exp-date');
        if (dateInput) dateInput.valueAsDate = new Date();
        window.loadExpensesModalData();
      };

      window.loadExpensesModalData = async () => {
        try {
          const res = await fetch('/api/expenses');
          const data = await res.json();
          const expenses = data.expenses || [];

          const now = new Date();
          const currentMonth = now.toISOString().slice(0, 7); // YYYY-MM
          const currentYear = now.toISOString().slice(0, 4); // YYYY

          const monthTotal = expenses
            .filter(e => e.date && e.date.startsWith(currentMonth))
            .reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

          const yearTotal = expenses
            .filter(e => e.date && e.date.startsWith(currentYear))
            .reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

          const summaryEl = document.getElementById('modal-exp-summary');
          if (summaryEl) {
            summaryEl.innerHTML = `إجمالي مصروفات الشهر الحالي: <span style="font-size:16px;color:#b45309;">${monthTotal.toFixed(2)} ر.س</span> | إجمالي السنة: ${yearTotal.toFixed(2)} ر.س`;
          }

          const listEl = document.getElementById('modal-expenses-list');
          if (listEl) {
            if (expenses.length === 0) {
              listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">لا توجد مصروفات مسجلة حتى الآن</div>';
            } else {
              listEl.innerHTML = expenses.map(e => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:13px;">
                  <div>
                    <div style="font-weight:700;color:#1e293b;">${e.description} <span style="font-size:11px;background:#e0f2fe;color:#0369a1;padding:2px 6px;border-radius:4px;margin-right:6px;">${e.category}</span></div>
                    <div style="color:#64748b;font-size:11px;margin-top:2px;">${e.date ? e.date.split('T')[0] : '-'}</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:10px;">
                    <span style="font-weight:700;color:#b45309;">${e.amount} ر.س</span>
                    <button onclick="window.deleteExpense('${e.id}')" style="background:#fee2e2;color:#dc2626;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;">حذف</button>
                  </div>
                </div>
              `).join('');
            }
          }
        } catch (err) {
          console.error('Error loading expenses:', err);
        }
      };

      window.submitModalExpense = async () => {
        const amount = document.getElementById('modal-exp-amount').value;
        const description = document.getElementById('modal-exp-desc').value;
        const category = document.getElementById('modal-exp-cat').value;
        const date = document.getElementById('modal-exp-date').value;

        if (!amount || !description || !category) {
          alert('يرجى تعبئة كافة الحقول المطلوبة (المبلغ، الوصف، التصنيف)');
          return;
        }

        await fetch('/api/expenses', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ amount, description, category, date })
        });

        document.getElementById('modal-exp-amount').value = '';
        document.getElementById('modal-exp-desc').value = '';
        document.getElementById('modal-exp-cat').value = '';
        alert('تمت إضافة المصروف بنجاح');
        window.loadExpensesModalData();
        if (typeof window.renderExpensesSection === 'function') {
          window.renderExpensesSection();
        }
      };

      let activeExpensesTab = false;

      window.deleteExpense = async (id) => {
        if (!confirm('هل أنت متأكد من حذف هذا المصروف؟')) return;
        await fetch('/api/expenses/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id })
        });
        window.loadExpensesModalData();
        if (typeof window.renderExpensesSection === 'function') {
          window.renderExpensesSection();
        }
      };

      window.renderExpensesSection = async () => {
        let container = document.getElementById('store-expenses-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'store-expenses-container';
          container.style.cssText = 'background:white; padding:24px; border-radius:16px; margin-top:20px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); direction:rtl;';
        }
        
        const res = await fetch('/api/expenses');
        const data = await res.json();
        const expenses = data.expenses || [];

        const now = new Date();
        const currentMonth = now.toISOString().slice(0, 7);
        const currentYear = now.toISOString().slice(0, 4);

        const monthTotal = expenses
          .filter(e => e.date && e.date.startsWith(currentMonth))
          .reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

        const yearTotal = expenses
          .filter(e => e.date && e.date.startsWith(currentYear))
          .reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

        container.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:15px; border-bottom:2px solid #f1f5f9; padding-bottom:15px;">
            <div>
              <h2 style="font-size:20px; font-weight:800; color:#1e293b; margin:0;">مصروفات ومصاريف المحل والمؤسسة</h2>
              <p style="margin:4px 0 0 0; color:#64748b; font-size:13px;">إدارة وتتبع أجار المحل، الفواتير، الصيانة، والرواتب بدقة</p>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <div style="background:#fef3c7; color:#92400e; padding:10px 16px; border-radius:10px; font-weight:700; font-size:13px; border:1px solid #fcd34d;">
                إجمالي الشهر: ${monthTotal.toFixed(2)} ر.س
              </div>
              <div style="background:#f1f5f9; color:#334155; padding:10px 16px; border-radius:10px; font-weight:700; font-size:13px; border:1px solid #cbd5e1;">
                إجمالي السنة: ${yearTotal.toFixed(2)} ر.س
              </div>
            </div>
          </div>
          
          <div style="background:#f8fafc; padding:20px; border-radius:12px; margin-bottom:25px; border:1px solid #e2e8f0;">
            <h4 style="margin:0 0 12px 0; font-size:15px; font-weight:700; color:#334155;">تسجيل مصروف جديد</h4>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px;">
              <input type="number" id="tab-exp-amount" placeholder="المبلغ (ر.س)" style="padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit;">
              <input type="text" id="tab-exp-desc" placeholder="الوصف (أجار المحل، كهرباء...)" style="padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit;">
              <input type="text" id="tab-exp-cat" placeholder="التصنيف (ثابت، تشغيلي، رواتب...)" style="padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit;">
              <input type="date" id="tab-exp-date" style="padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit;">
              <button onclick="window.submitTabExpense()" style="background:#f59e0b; color:white; border:none; padding:10px 20px; border-radius:8px; font-weight:700; cursor:pointer; font-family:inherit;">إضافة المصروف</button>
            </div>
          </div>

          <div>
            <h4 style="margin:0 0 12px 0; font-size:15px; font-weight:700; color:#334155;">سجل المصروفات المسجلة</h4>
            <div style="overflow-x:auto;">
              <table style="width:100%; border-collapse:collapse; text-align:right; font-size:13px;">
                <thead>
                  <tr style="background:#f1f5f9; color:#475569;">
                    <th style="padding:12px; border-bottom:2px solid #e2e8f0; font-weight:700;">التاريخ</th>
                    <th style="padding:12px; border-bottom:2px solid #e2e8f0; font-weight:700;">الوصف</th>
                    <th style="padding:12px; border-bottom:2px solid #e2e8f0; font-weight:700;">التصنيف</th>
                    <th style="padding:12px; border-bottom:2px solid #e2e8f0; font-weight:700;">المبلغ</th>
                    <th style="padding:12px; border-bottom:2px solid #e2e8f0; font-weight:700; text-align:center;">الإجراء</th>
                  </tr>
                </thead>
                <tbody>
                  ${expenses.length === 0 ? '<tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">لا توجد مصروفات مسجلة حتى الآن</td></tr>' : 
                    expenses.map(e => `
                      <tr style="border-bottom:1px solid #f1f5f9;">
                        <td style="padding:12px; color:#64748b;">${e.date ? e.date.split('T')[0] : '-'}</td>
                        <td style="padding:12px; font-weight:600; color:#1e293b;">${e.description}</td>
                        <td style="padding:12px;"><span style="background:#e0f2fe; color:#0369a1; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600;">${e.category}</span></td>
                        <td style="padding:12px; font-weight:700; color:#b45309;">${e.amount} ر.س</td>
                        <td style="padding:12px; text-align:center;">
                          <button onclick="window.deleteExpense('${e.id}')" style="background:#fee2e2; color:#dc2626; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;">حذف</button>
                        </td>
                      </tr>
                    `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

        const dateInput = document.getElementById('tab-exp-date');
        if (dateInput && !dateInput.value) {
          dateInput.valueAsDate = new Date();
        }

        const activeContent = document.querySelector('main') || document.getElementById('root');
        if (activeContent) {
          const existingTabContent = activeContent.querySelector('.space-y-4') || activeContent.lastElementChild;
          if (existingTabContent && activeExpensesTab) {
            existingTabContent.innerHTML = '';
            existingTabContent.appendChild(container);
          }
        }
      };

      window.submitTabExpense = async () => {
        const amount = document.getElementById('tab-exp-amount').value;
        const description = document.getElementById('tab-exp-desc').value;
        const category = document.getElementById('tab-exp-cat').value;
        const date = document.getElementById('tab-exp-date').value;
        if (!amount || !description || !category) {
          alert('يرجى تعبئة كافة الحقول المطلوبة للمصروف');
          return;
        }
        await fetch('/api/expenses', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ amount, description, category, date })
        });
        alert('تمت إضافة المصروف بنجاح');
        window.renderExpensesSection();
      };

      // مراقب DOM فائق الدقة لإدراج زر "مصروفات المؤسسة" بجانب تبويب "لوحة القيادة والمؤشرات" وفي الشريط العلوي والزر العائم
      setInterval(() => {
        // 1. البحث عن زر "لوحة القيادة والمؤشرات" في شريط التنقل الرئيسي لإدراج زر المصروفات بجانبه مباشرة
        const allEls = document.querySelectorAll('button, div, span, a');
        allEls.forEach(el => {
          if (el.textContent && el.textContent.trim() === 'لوحة القيادة والمؤشرات' && el.parentElement) {
            const parent = el.parentElement;
            if (!parent.querySelector('#injected-expenses-nav-btn')) {
              const btn = document.createElement('button');
              btn.id = 'injected-expenses-nav-btn';
              btn.innerHTML = '💰 مصروفات المؤسسة';
              btn.style.cssText = 'background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; font-size: 13px; margin-right: 8px; box-shadow: 0 2px 6px rgba(245,158,11,0.4); display: inline-flex; align-items:center; gap:5px; z-index:99999;';
              btn.onclick = window.initExpensesUI;
              parent.insertBefore(btn, el.nextSibling);
            }
          }
        });

        // 2. البحث عن تبويب "سجل فواتير الآجل" في العملاء والذمم لإضافة "مصروفات المحل"
        const buttons = document.querySelectorAll('button, div, span');
        buttons.forEach(el => {
          if (el.textContent && (el.textContent.includes('سجل فواتير الآجل') || el.textContent.includes('العملاء والذمم')) && el.parentElement) {
            const parent = el.parentElement;
            if (!parent.querySelector('#custom-expenses-tab')) {
              const myTab = document.createElement('button');
              myTab.id = 'custom-expenses-tab';
              myTab.innerText = 'مصروفات المحل';
              myTab.style.cssText = 'padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; background: white; border: 1px solid #cbd5e1; color: #334155; margin-right: 8px; font-family: inherit; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);';
              myTab.onclick = () => {
                activeExpensesTab = true;
                parent.querySelectorAll('button').forEach(b => {
                  if (b !== myTab) b.style.background = 'white';
                });
                myTab.style.background = '#0f172a';
                myTab.style.color = 'white';
                window.renderExpensesSection();
              };
              parent.appendChild(myTab);
            }
          }
        });
      }, 500);

      // إضافة زر ثابت في أعلى اليمين (بجانب اسم المنشأة) لتأكيد ظهور الزر دائماً
      if (!document.getElementById('top-bar-expenses-btn')) {
        const topBarBtn = document.createElement('button');
        topBarBtn.id = 'top-bar-expenses-btn';
        topBarBtn.innerHTML = '💰 مصروفات المؤسسة';
        topBarBtn.onclick = window.initExpensesUI;
        topBarBtn.style.cssText = 'position: fixed; top: 12px; right: 280px; z-index: 9999999; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; padding: 6px 14px; border-radius: 8px; font-weight: 800; font-size: 12px; border: 2px solid white; box-shadow: 0 4px 12px rgba(245,158,11,0.4); cursor: pointer; font-family: inherit;';
        document.body.appendChild(topBarBtn);
      }

      // إضافة زر عائم فائق الوضوح في أسفل الشاشة (يمين)
      if (!document.getElementById('floating-expenses-btn')) {
        const floatBtn = document.createElement('button');
        floatBtn.id = 'floating-expenses-btn';
        floatBtn.innerHTML = '<span>💰</span><span>مصروفات المحل والمؤسسة</span>';
        floatBtn.onclick = window.initExpensesUI;
        floatBtn.style.cssText = 'position:fixed; bottom:25px; right:25px; z-index:99999999; background:linear-gradient(135deg, #0f172a, #1e293b); color:white; padding:14px 22px; border-radius:35px; box-shadow:0 10px 30px rgba(15, 23, 42, 0.6); border:2.5px solid #f59e0b; font-family:inherit; font-weight:800; font-size:14px; display:flex; align-items:center; gap:8px; cursor:pointer; transition:all 0.2s;';
        floatBtn.onmouseover = () => floatBtn.style.transform = 'scale(1.08)';
        floatBtn.onmouseout = () => floatBtn.style.transform = 'scale(1)';
        document.body.appendChild(floatBtn);
      }
    </script>
  </body>
</html>
